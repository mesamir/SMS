<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Certificate · Admin</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body style="background:var(--ink-50);">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:520px;width:100%;">

    <div style="text-align:center;margin-bottom:24px;">
      <div style="width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(135deg,var(--primary-500),var(--primary-700));color:#fff;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
      </div>
      <h1 style="font-size:22px;font-weight:700;">Verify Certificate</h1>
      <p style="font-size:13px;color:var(--ink-500);margin-top:6px;">Enter the certificate number or scan QR code</p>
    </div>

    <div class="card" style="padding:24px;">
      <form onsubmit="event.preventDefault();window.toast('Certificate verified','success')">
        <div style="margin-bottom:16px;">
          <label class="label">Certificate number</label>
          <input type="text" class="input" placeholder="e.g., CERT-2081-0248" style="font-family:'JetBrains Mono',monospace;" required>
        </div>
        <div style="margin-bottom:20px;">
          <label class="label">Student admission number (optional)</label>
          <input type="text" class="input" placeholder="ADM-2081-0001" style="font-family:'JetBrains Mono',monospace;">
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/></svg>
          Verify certificate
        </button>
      </form>

      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--ink-100);text-align:center;">
        <p style="font-size:12px;color:var(--ink-500);">Or scan the QR code on the certificate</p>
        <button class="btn btn-secondary btn-block" style="margin-top:10px;">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Scan QR code
        </button>
      </div>
    </div>

    <p style="text-align:center;font-size:11px;color:var(--ink-500);margin-top:20px;">
      This is a public verification page. Anyone with a certificate number can verify authenticity.
    </p>

  </div>
</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
