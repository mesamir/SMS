<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Teacher · Admin</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13"/></svg></div><span class="sidebar-brand">School<span>SaaS</span></span></div>
    <div class="sidebar-user"><div class="avatar avatar-md avatar-gradient">N</div><div class="sidebar-user-info"><p class="role">Welcome back,</p><p class="name">Nabin Sharma</p></div></div>
    <nav class="sidebar-nav">
      <p class="sidebar-group-label">Main Menu</p>
      <a href="../dashboard.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3"/></svg>Dashboard</a>
      <a href="list.html" class="nav-item active"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/></svg>Teachers</a>
    </nav>
  </aside>

  <div class="main">
    <header class="main-header">
      <div class="main-header-left">
        <button class="hamburger btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <nav class="breadcrumbs"><a href="../dashboard.html">Dashboard</a><span class="separator">/</span><a href="list.html">Teachers</a><span class="separator">/</span><a href="detail.html">Sunita Sharma</a><span class="separator">/</span><span class="current">Edit</span></nav>
      </div>
      <div class="main-header-right">
        <div class="dropdown"><button style="display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:9999px;" data-dropdown><div class="avatar avatar-sm avatar-gradient">N</div><span style="font-size:13px;font-weight:500;">Nabin</span></button>
          <div class="dropdown-menu"><a href="../../auth/login.html" class="dropdown-item dropdown-item-danger">Sign out</a></div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="main-content-inner">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
          <a href="detail.html" class="btn btn-secondary btn-icon"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg></a>
          <div>
            <h1 class="page-title">Edit teacher</h1>
            <p class="page-subtitle">Sunita Sharma · EMP-001</p>
          </div>
        </div>

        <form onsubmit="event.preventDefault();window.toast('Teacher updated','success');setTimeout(()=>window.location.href='detail.html',1200);">
          <div style="display:grid;grid-template-columns:1fr;gap:24px;" class="layout">
            <style>@media (min-width:1024px){.layout{grid-template-columns:2fr 1fr!important;}}</style>

            <div style="display:flex;flex-direction:column;gap:20px;">
              <div class="card">
                <div class="card-header"><h2 class="card-title">Personal information</h2></div>
                <div class="card-body" style="display:grid;gap:16px;">
                  <div style="display:grid;grid-template-columns:1fr;gap:16px;" class="g2">
                    <style>@media (min-width:640px){.g2{grid-template-columns:1fr 1fr!important;}}</style>
                    <div><label class="label">Full name</label><input type="text" class="input" value="Sunita Sharma"></div>
                    <div><label class="label">Employee ID</label><input type="text" class="input" value="EMP-001" readonly style="background:var(--ink-50);font-family:'JetBrains Mono',monospace;"></div>
                  </div>
                  <div style="display:grid;grid-template-columns:1fr;gap:16px;" class="g2">
                    <div>
                      <label class="label">Phone</label>
                      <div class="input-group"><span class="input-group-prefix">+977</span><input type="text" class="input" value="9812345678"></div>
                    </div>
                    <div><label class="label">Email</label><input type="email" class="input" value="sunita.sharma@littleangels.edu.np"></div>
                  </div>
                  <div><label class="label">Address</label><input type="text" class="input" value="Balkumari, Ward 5, Lalitpur"></div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><h2 class="card-title">Employment</h2></div>
                <div class="card-body" style="display:grid;gap:16px;">
                  <div style="display:grid;grid-template-columns:1fr;gap:16px;" class="g2">
                    <div><label class="label">Designation</label><select class="select"><option>Senior Math Teacher</option><option>Head of Department</option><option>Vice Principal</option></select></div>
                    <div><label class="label">Department</label><select class="select"><option>Mathematics</option><option>Science</option><option>Languages</option></select></div>
                  </div>
                  <div style="display:grid;grid-template-columns:1fr;gap:16px;" class="g2">
                    <div><label class="label">Joining date (BS)</label><input type="text" class="input" value="2078-01-15" style="font-family:'JetBrains Mono',monospace;"></div>
                    <div><label class="label">Contract type</label><select class="select"><option>Permanent</option><option>Contract</option><option>Part-time</option></select></div>
                  </div>
                  <div>
                    <label class="label">Branch assignment</label>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
                      <label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 12px;border:1px solid var(--primary-500);background:var(--primary-50);border-radius:8px;"><input type="checkbox" class="checkbox" checked> KTM Main Campus</label>
                      <label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 12px;border:1px solid var(--ink-200);border-radius:8px;"><input type="checkbox" class="checkbox"> Pokhara Branch</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:20px;">
              <div class="card" style="padding:20px;">
                <h3 class="card-title" style="margin-bottom:12px;">Profile photo</h3>
                <div style="text-align:center;">
                  <div class="avatar avatar-xl avatar-primary" style="margin:0 auto;">SS</div>
                  <button type="button" class="btn btn-secondary btn-sm" style="margin-top:12px;">Replace photo</button>
                </div>
              </div>

              <div class="card" style="padding:20px;">
                <div style="display:flex;flex-direction:column;gap:10px;">
                  <button type="submit" class="btn btn-primary btn-block">Save changes</button>
                  <a href="detail.html" class="btn btn-secondary btn-block">Cancel</a>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer class="main-footer">© 2026 <span style="font-weight:500;color:var(--primary-600);">School SaaS</span>. All rights reserved.</footer>
  </div>
</div>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/dropdown.js"></script>
</body>
</html>
