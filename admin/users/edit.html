<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit User · Admin</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13"/></svg></div><span class="sidebar-brand">School<span>SaaS</span></span></div>
    <div class="sidebar-user"><div class="avatar avatar-md avatar-gradient">N</div><div class="sidebar-user-info"><p class="role">Welcome back,</p><p class="name">Nabin Sharma</p></div></div>
    <nav class="sidebar-nav">
      <p class="sidebar-group-label">Main Menu</p>
      <a href="../dashboard.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3"/></svg>Dashboard</a>
      <div class="nav-item open" data-toggle>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87"/></svg>
        Users & Roles
        <svg class="nav-chevron" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </div>
      <div class="nav-submenu">
        <a href="list.html" style="color:var(--primary-600);">Users</a>
      </div>
    </nav>
  </aside>

  <div class="main">
    <header class="main-header">
      <div class="main-header-left">
        <button class="hamburger btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <nav class="breadcrumbs"><a href="../dashboard.html">Dashboard</a><span class="separator">/</span><a href="list.html">Users</a><span class="separator">/</span><span class="current">Edit</span></nav>
      </div>
      <div class="main-header-right">
        <button class="btn btn-secondary btn-sm">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="window.toast('User updated','success')">Save changes</button>
        <div class="dropdown"><button style="display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:9999px;" data-dropdown><div class="avatar avatar-sm avatar-gradient">N</div><span style="font-size:13px;font-weight:500;">Nabin</span></button>
          <div class="dropdown-menu"><a href="../../auth/login.html" class="dropdown-item dropdown-item-danger">Sign out</a></div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="main-content-inner">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
          <a href="detail.html" class="btn btn-secondary btn-icon"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg></a>
          <div>
            <h1 class="page-title">Edit user</h1>
            <p class="page-subtitle">Sunita Sharma</p>
          </div>
        </div>

        <form onsubmit="event.preventDefault();window.toast('User updated','success');">
          <div style="display:grid;grid-template-columns:1fr;gap:24px;" class="layout">
            <style>@media (min-width:1024px){.layout{grid-template-columns:2fr 1fr!important;}}</style>

            <div style="display:flex;flex-direction:column;gap:20px;">
              <div class="card">
                <div class="card-header"><h2 class="card-title">Basic info</h2></div>
                <div class="card-body" style="display:grid;gap:16px;">
                  <div style="display:grid;grid-template-columns:1fr;gap:16px;" class="g2">
                    <style>@media (min-width:640px){.g2{grid-template-columns:1fr 1fr!important;}}</style>
                    <div><label class="label">Full name</label><input type="text" class="input" value="Sunita Sharma"></div>
                    <div><label class="label">Email</label><input type="email" class="input" value="sunita.sharma@littleangels.edu.np"></div>
                  </div>
                  <div style="display:grid;grid-template-columns:1fr;gap:16px;" class="g2">
                    <div>
                      <label class="label">Phone</label>
                      <div class="input-group"><span class="input-group-prefix">+977</span><input type="text" class="input" value="9812345678"></div>
                    </div>
                    <div><label class="label">Employee ID</label><input type="text" class="input" value="EMP-001" readonly style="background:var(--ink-50);font-family:'JetBrains Mono',monospace;"></div>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><h2 class="card-title">Roles</h2></div>
                <div class="card-body" style="display:grid;gap:10px;">
                  <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:12px;border:1px solid var(--primary-500);background:var(--primary-50);border-radius:8px;cursor:pointer;">
                    <input type="checkbox" class="checkbox" checked> Principal
                  </label>
                  <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:12px;border:1px solid var(--primary-500);background:var(--primary-50);border-radius:8px;cursor:pointer;">
                    <input type="checkbox" class="checkbox" checked> Academic Coordinator
                  </label>
                  <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:12px;border:1px solid var(--ink-200);border-radius:8px;cursor:pointer;">
                    <input type="checkbox" class="checkbox"> Teacher
                  </label>
                </div>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:20px;">
              <div class="card" style="padding:20px;">
                <div style="display:flex;flex-direction:column;gap:10px;">
                  <button type="submit" class="btn btn-primary btn-block">Save changes</button>
                  <a href="detail.html" class="btn btn-secondary btn-block">Cancel</a>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer class="main-footer">© 2026 <span style="font-weight:500;color:var(--primary-600);">School SaaS</span>. All rights reserved.</footer>
  </div>
</div>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/dropdown.js"></script>
</body>
</html>
