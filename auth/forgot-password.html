<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · School SaaS</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body style="background:var(--ink-50);">
<div style="max-width:380px;margin:0 auto;padding:64px 24px;">

  <div style="text-align:center;margin-bottom:32px;">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--primary-100);color:var(--primary-600);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
      </svg>
    </div>
    <h1 style="font-size:22px;font-weight:700;">Reset your password</h1>
    <p style="font-size:14px;color:var(--ink-500);margin-top:8px;">Enter your email and we'll send you a reset link</p>
  </div>

  <form onsubmit="event.preventDefault();window.toast('Reset link sent. Check your inbox.', 'success');setTimeout(()=>window.location.href='login.html',1500);">
    <div style="margin-bottom:20px;">
      <label class="label" for="email">Email address</label>
      <input id="email" type="email" class="input" placeholder="you@school.edu.np" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
  </form>

  <div style="text-align:center;margin-top:24px;">
    <a href="login.html" style="font-size:13px;color:var(--ink-500);">← Back to sign in</a>
  </div>

</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
