<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-factor authentication · School SaaS</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .otp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .otp-input { width: 100%; height: 56px; text-align: center; font-size: 20px; font-weight: 600; border: 1px solid var(--ink-200); border-radius: var(--radius-sm); }
    .otp-input:focus { outline: none; border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-100); }
  </style>
</head>
<body style="background:var(--ink-50);">
<div style="max-width:380px;margin:0 auto;padding:64px 24px;">

  <div style="text-align:center;margin-bottom:32px;">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--primary-100);color:var(--primary-600);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 style="font-size:22px;font-weight:700;">Two-factor authentication</h1>
    <p style="font-size:14px;color:var(--ink-500);margin-top:8px;">Enter the 6-digit code from your authenticator app</p>
  </div>

  <form onsubmit="event.preventDefault();window.location.href='../admin/dashboard.html';">
    <div class="otp-grid" style="margin-bottom:24px;">
      <input class="otp-input" maxlength="1" inputmode="numeric" autofocus>
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
    </div>

    <button type="submit" class="btn btn-primary btn-block">Verify</button>
  </form>

  <div style="text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:8px;">
    <a href="#" style="font-size:13px;color:var(--primary-600);">Use recovery code instead</a>
    <a href="login.html" style="font-size:13px;color:var(--ink-500);">← Back to sign in</a>
  </div>

</div>
</body>
</html>
