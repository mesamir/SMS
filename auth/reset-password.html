<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password · School SaaS</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body style="background:var(--ink-50);">
<div style="max-width:380px;margin:0 auto;padding:64px 24px;">

  <div style="text-align:center;margin-bottom:32px;">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--primary-100);color:var(--primary-600);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 style="font-size:22px;font-weight:700;">Set a new password</h1>
    <p style="font-size:14px;color:var(--ink-500);margin-top:8px;">Choose a strong password you haven't used before</p>
  </div>

  <form onsubmit="event.preventDefault();window.toast('Password reset. Please sign in.', 'success');setTimeout(()=>window.location.href='login.html',1200);">
    <div style="margin-bottom:16px;">
      <label class="label">New password</label>
      <input type="password" class="input" placeholder="••••••••" required minlength="8">
      <p class="help">At least 8 characters, one number, one symbol</p>
    </div>
    <div style="margin-bottom:20px;">
      <label class="label">Confirm new password</label>
      <input type="password" class="input" placeholder="••••••••" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Reset password</button>
  </form>

</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
