<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify phone · School SaaS</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .otp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .otp-input { width: 100%; height: 56px; text-align: center; font-size: 20px; font-weight: 600; border: 1px solid var(--ink-200); border-radius: var(--radius-sm); }
    .otp-input:focus { outline: none; border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-100); }
  </style>
</head>
<body style="background:var(--ink-50);">
<div style="max-width:380px;margin:0 auto;padding:64px 24px;text-align:center;">
  <div style="width:56px;height:56px;border-radius:16px;background:var(--primary-100);color:var(--primary-600);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
    </svg>
  </div>
  <h1 style="font-size:22px;font-weight:700;">Verify your phone</h1>
  <p style="font-size:14px;color:var(--ink-500);margin-top:8px;">We sent a 6-digit code to <strong>+977 98XXXXXXXX</strong></p>

  <form onsubmit="event.preventDefault();window.toast('Phone verified', 'success');window.location.href='login.html';" style="margin-top:32px;">
    <div class="otp-grid" style="margin-bottom:24px;">
      <input class="otp-input" maxlength="1" inputmode="numeric" autofocus>
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
      <input class="otp-input" maxlength="1" inputmode="numeric">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Verify</button>
  </form>

  <div style="margin-top:24px;">
    <button onclick="window.toast('Code resent', 'success')" style="font-size:13px;color:var(--primary-600);">Resend code</button>
  </div>
</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
