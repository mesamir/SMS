<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leave Request · Parent</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <style>
    .mobile-page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; background: var(--ink-50); }
  </style>
</head>
<body>

<div class="mobile-page">

  <header style="position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ink-100);">
    <div style="padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;">
      <a href="dashboard.html" class="btn btn-ghost btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg></a>
      <p style="font-size:15px;font-weight:600;">Leave request</p>
      <div style="width:36px;"></div>
    </div>
  </header>

  <!-- Balance -->
  <div style="padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
    <div class="card" style="padding:14px;">
      <p style="font-size:11px;color:var(--ink-500);font-weight:600;text-transform:uppercase;margin:0;">Used this year</p>
      <p style="font-size:22px;font-weight:700;margin-top:6px;">8 days</p>
    </div>
    <div class="card" style="padding:14px;">
      <p style="font-size:11px;color:var(--ink-500);font-weight:600;text-transform:uppercase;margin:0;">Remaining</p>
      <p style="font-size:22px;font-weight:700;color:#166534;margin-top:6px;">12 days</p>
    </div>
  </div>

  <!-- Form -->
  <form style="padding:0 20px 20px;" onsubmit="event.preventDefault();window.toast('Leave request submitted','success');setTimeout(()=>window.location.href='dashboard.html',1500);">
    <div class="card" style="padding:16px;">
      <div style="margin-bottom:14px;">
        <label class="label">Student</label>
        <select class="select">
          <option>Aarav Shrestha · Grade 8A</option>
          <option>Sita Shrestha · Grade 5B</option>
        </select>
      </div>

      <div style="margin-bottom:14px;">
        <label class="label">Leave type</label>
        <select class="select">
          <option>Sick leave</option>
          <option>Family emergency</option>
          <option>Festival / personal</option>
          <option>Medical appointment</option>
          <option>Other</option>
        </select>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div>
          <label class="label">From</label>
          <input type="text" class="input" value="16 Ashoj 2081" data-bs-date>
        </div>
        <div>
          <label class="label">To</label>
          <input type="text" class="input" value="17 Ashoj 2081" data-bs-date>
        </div>
      </div>

      <div style="margin-bottom:14px;">
        <label class="label">Reason</label>
        <textarea class="textarea" placeholder="Describe the reason for leave..." required>Aarav has fever and cold, advised rest by doctor.</textarea>
      </div>

      <div>
        <label class="label">Attachment (optional)</label>
        <label style="display:flex;align-items:center;gap:10px;padding:14px;border:1px dashed var(--ink-300);border-radius:10px;background:var(--ink-50);cursor:pointer;">
          <svg width="20" height="20" fill="none" stroke="var(--ink-500)" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <div style="flex:1;">
            <p style="font-size:13px;font-weight:500;margin:0;">Upload doctor's note</p>
            <p style="font-size:11px;color:var(--ink-500);margin-top:2px;">PDF, JPG, or PNG · Max 5MB</p>
          </div>
          <input type="file" hidden>
        </label>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button type="submit" class="btn btn-primary btn-block btn-lg">Submit request</button>
    </div>
  </form>

  <!-- History -->
  <div style="padding:0 20px 20px;">
    <h3 style="font-size:14px;font-weight:600;margin:0 0 10px;">Recent requests</h3>
    <div class="card">
      <div style="padding:14px 16px;border-bottom:1px solid var(--ink-100);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="flex:1;">
            <p style="font-size:14px;font-weight:600;margin:0;">Sick leave</p>
            <p style="font-size:11px;color:var(--ink-500);margin-top:4px;">10–11 Ashoj 2081 · Aarav</p>
          </div>
          <span class="badge badge-success">Approved</span>
        </div>
      </div>
      <div style="padding:14px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="flex:1;">
            <p style="font-size:14px;font-weight:600;margin:0;">Family function</p>
            <p style="font-size:11px;color:var(--ink-500);margin-top:4px;">28 Bhadra 2081 · Aarav</p>
          </div>
          <span class="badge badge-success">Approved</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="mobile-nav" style="max-width:480px;margin:0 auto;">
    <div class="mobile-nav-grid">
      <a href="dashboard.html" class="mobile-nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9"/></svg>Home</a>
      <a href="attendance.html" class="mobile-nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/></svg>Attendance</a>
      <a href="fees.html" class="mobile-nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2"/></svg>Fees</a>
      <a href="results.html" class="mobile-nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6"/></svg>Results</a>
      <a href="messages.html" class="mobile-nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01"/></svg>Chat</a>
    </div>
  </nav>

</div>

<script src="../assets/js/app.js"></script>
</body>
</html>
