<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay fees · Parent</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <style>
    .mobile-page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; }
    .provider-option { display: flex; align-items: center; gap: 12px; padding: 16px; background: #fff; border: 2px solid var(--ink-200); border-radius: 12px; cursor: pointer; transition: all 0.15s; }
    .provider-option.selected { border-color: var(--primary-500); background: var(--primary-50); }
    .provider-logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 12px; }
  </style>
</head>
<body>

<div class="mobile-page">

  <header style="position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ink-100);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;">
    <button class="btn btn-ghost btn-icon" onclick="window.history.back()">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </button>
    <h1 style="font-size:16px;font-weight:600;">Pay fees</h1>
    <div style="width:36px;"></div>
  </header>

  <!-- Summary -->
  <div style="padding:20px;">
    <div class="card" style="padding:16px;">
      <p style="font-size:12px;color:var(--ink-500);">Paying for</p>
      <p style="font-size:16px;font-weight:600;margin-top:4px;">Aarav Shrestha</p>
      <p style="font-size:12px;color:var(--ink-500);">Grade 8 · A · ADM-2081-0001</p>
      <div style="border-top:1px solid var(--ink-100);margin-top:16px;padding-top:16px;">
        <div style="display:flex;justify-content:space-between;font-size:14px;">
          <span style="color:var(--ink-500);">Ashoj fees</span>
          <span>NPR 12,500</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-top:8px;">
          <span style="color:var(--ink-500);">Late fee</span>
          <span>NPR 0</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600;margin-top:12px;padding-top:12px;border-top:1px solid var(--ink-100);">
          <span>Total</span>
          <span style="color:var(--primary-600);">NPR 12,500</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Provider -->
  <div style="padding:0 20px 20px;">
    <p style="font-size:14px;font-weight:600;margin-bottom:12px;">Choose payment method</p>
    <div style="display:flex;flex-direction:column;gap:10px;">

      <label class="provider-option selected">
        <input type="radio" name="provider" class="radio" checked>
        <div class="provider-logo" style="background:#5C2D91;">K</div>
        <div style="flex:1;">
          <p style="font-size:14px;font-weight:600;">Khalti</p>
          <p style="font-size:12px;color:var(--ink-500);">Digital wallet</p>
        </div>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="color:var(--primary-500);"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </label>

      <label class="provider-option">
        <input type="radio" name="provider" class="radio">
        <div class="provider-logo" style="background:#60BB46;">e</div>
        <div style="flex:1;">
          <p style="font-size:14px;font-weight:600;">eSewa</p>
          <p style="font-size:12px;color:var(--ink-500);">Digital wallet</p>
        </div>
      </label>

      <label class="provider-option">
        <input type="radio" name="provider" class="radio">
        <div class="provider-logo" style="background:#1A3E7A;">C</div>
        <div style="flex:1;">
          <p style="font-size:14px;font-weight:600;">ConnectIPS</p>
          <p style="font-size:12px;color:var(--ink-500);">Bank transfer (NCHL)</p>
        </div>
      </label>

    </div>
  </div>

  <!-- Secure notice -->
  <div style="padding:0 20px;">
    <div style="background:#DBEAFE;color:#1E40AF;padding:12px 16px;border-radius:10px;font-size:12px;display:flex;gap:10px;">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="flex-shrink:0;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      <span>Payment is verified server-side. Amount cannot be modified.</span>
    </div>
  </div>

  <!-- Sticky CTA -->
  <div style="position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:16px 20px;background:#fff;border-top:1px solid var(--ink-100);">
    <button class="btn btn-primary btn-block btn-lg" onclick="window.toast('Redirecting to Khalti...', 'info');setTimeout(()=>window.location.href='payment-success.html',1500);">
      Pay NPR 12,500
    </button>
  </div>

</div>

<script src="../assets/js/app.js"></script>
<script>
  // Provider selection
  document.querySelectorAll('.provider-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.provider-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
    });
  });
</script>
</body>
</html>
