<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Attendance · Teacher</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <style>
    .mobile-page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; }

    .teacher-header {
      position: sticky; top: 0; z-index: 20;
      background: #fff; border-bottom: 1px solid var(--ink-100);
      padding: 0 20px;
    }
    .teacher-header-top { height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .teacher-header-title { text-align: center; }
    .teacher-header-title .sub { font-size: 12px; color: var(--ink-500); }
    .teacher-header-title .main { font-size: 14px; font-weight: 600; }

    .summary-bar { display: flex; gap: 8px; padding-bottom: 12px; flex-wrap: wrap; }
    .summary-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; }

    .student-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #fff;
      border: 1px solid var(--ink-200); border-radius: 12px;
      transition: all 0.15s;
    }
    .student-row.present { border-color: #BBF7D0; background: rgba(220,252,231,0.3); }
    .student-row.absent { border-color: #FECACA; background: rgba(254,226,226,0.3); }
    .student-row.late { border-color: #FDE68A; background: rgba(254,243,199,0.3); }

    .status-btn {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--ink-100); color: var(--ink-400);
      transition: all 0.15s; font-size: 12px; font-weight: 600;
    }
    .status-btn.active-present { background: #22C55E; color: #fff; }
    .status-btn.active-absent { background: #EF4444; color: #fff; }
    .status-btn.active-late { background: #F59E0B; color: #fff; }
  </style>
</head>
<body>

<div class="mobile-page">

  <header class="teacher-header">
    <div class="teacher-header-top">
      <button class="btn btn-ghost btn-icon" onclick="window.history.back()">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </button>
      <div class="teacher-header-title">
        <p class="sub">Attendance</p>
        <p class="main">Grade 8 · Section A</p>
      </div>
      <button class="btn btn-ghost btn-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01"/></svg>
      </button>
    </div>

    <div style="display:flex;gap:12px;padding-bottom:12px;">
      <button class="btn btn-secondary btn-sm" style="flex:1;">15 Ashoj 2081</button>
      <button class="btn btn-secondary btn-sm" style="flex:1;">Period 3</button>
    </div>

    <div class="summary-bar">
      <span class="summary-pill" style="background:#DCFCE7;color:#166534;">
        <span style="width:6px;height:6px;border-radius:50%;background:#22C55E;"></span> 32 Present
      </span>
      <span class="summary-pill" style="background:#FEE2E2;color:#991B1B;">
        <span style="width:6px;height:6px;border-radius:50%;background:#EF4444;"></span> 4 Absent
      </span>
      <span class="summary-pill" style="background:#FEF3C7;color:#92400E;">
        <span style="width:6px;height:6px;border-radius:50%;background:#F59E0B;"></span> 2 Late
      </span>
    </div>
  </header>

  <div style="padding:16px 20px 8px;display:flex;gap:8px;">
    <button class="btn btn-secondary btn-sm" style="flex:1;background:#DCFCE7;color:#166534;border-color:#BBF7D0;">Mark all present</button>
    <button class="btn btn-secondary btn-sm" style="flex:1;">Reset</button>
  </div>

  <div style="padding:8px 20px;display:flex;flex-direction:column;gap:8px;">

    <!-- Present -->
    <div class="student-row present">
      <div class="avatar avatar-md avatar-primary">AS</div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">Aarav Shrestha</p>
        <p style="font-size:12px;color:var(--ink-500);">Roll 08-014</p>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="status-btn active-present"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></button>
        <button class="status-btn"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
        <button class="status-btn">L</button>
      </div>
    </div>

    <!-- Absent -->
    <div class="student-row absent">
      <div class="avatar avatar-md avatar-blue">ST</div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">Sita Thapa</p>
        <p style="font-size:12px;color:var(--ink-500);">Roll 08-015</p>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="status-btn"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></button>
        <button class="status-btn active-absent"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
        <button class="status-btn">L</button>
      </div>
    </div>

    <!-- Late -->
    <div class="student-row late">
      <div class="avatar avatar-md avatar-amber">BK</div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">Bikash Karki</p>
        <p style="font-size:12px;color:var(--ink-500);">Roll 08-016</p>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="status-btn"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></button>
        <button class="status-btn"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
        <button class="status-btn active-late">L</button>
      </div>
    </div>

  </div>

  <!-- Sticky submit -->
  <div style="position:fixed;bottom:64px;left:0;right:0;max-width:480px;margin:0 auto;padding:12px 20px;background:linear-gradient(to top,var(--ink-50),transparent);">
    <button class="btn btn-primary btn-block btn-lg" onclick="window.toast('Attendance submitted. Parents notified.', 'success');setTimeout(()=>window.location.href='dashboard.html',1200);">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Submit attendance
    </button>
  </div>

  <nav class="mobile-nav">
    <div class="mobile-nav-grid">
      <a href="dashboard.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </a>
      <a href="attendance-mark.html" class="mobile-nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Attendance
      </a>
      <a href="homework-list.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg>
        Homework
      </a>
      <a href="marks-entry.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Marks
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Profile
      </a>
    </div>
  </nav>

</div>

<script src="../assets/js/app.js"></script>
<script>
  // Toggle status buttons
  document.querySelectorAll('.student-row').forEach(row => {
    const btns = row.querySelectorAll('.status-btn');
    btns.forEach((btn, i) => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.className = 'status-btn');
        if (i === 0) { btn.classList.add('active-present'); row.className = 'student-row present'; }
        if (i === 1) { btn.classList.add('active-absent'); row.className = 'student-row absent'; }
        if (i === 2) { btn.classList.add('active-late'); row.className = 'student-row late'; }
      });
    });
  });
</script>
</body>
</html>
